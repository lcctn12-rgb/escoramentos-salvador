<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mapa interativo dos escoramentos de fachada do Centro Histórico de Salvador, com fotos e fichas técnicas de avaliação.">
    <title>Escoramentos de Fachada | Centro Histórico de Salvador</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --green: #1E6B3E;
            --green-dark: #16522F;
            --green-light: #E9F5EE;
            --red: #C0392B;
            --ink: #24302A;
            --ink-soft: #5B6B62;
            --paper: #FBFAF7;
            --surface: #FFFFFF;
            --border: #E1E5DE;
        }

        html, body, #map { width: 100%; height: 100%; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--paper);
            color: var(--ink);
        }

        .container { display: flex; height: 100vh; }

        .sidebar {
            width: 320px;
            background: var(--surface);
            overflow-y: auto;
            border-right: 2px solid var(--green);
            padding: 20px;
            z-index: 500;
            box-shadow: 2px 0 8px rgba(0,0,0,0.06);
            flex-shrink: 0;
        }

        .sidebar h1 {
            color: var(--green-dark);
            margin-bottom: 4px;
            font-size: 1.25em;
        }

        .sidebar .subtitle {
            color: var(--ink-soft);
            font-size: 0.82em;
            margin-bottom: 15px;
        }

        .search-box {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid var(--green);
            border-radius: 6px;
            font-size: 0.95em;
            font-family: inherit;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--green-dark);
        }

        .marker-list { display: flex; flex-direction: column; gap: 8px; }

        .marker-item {
            padding: 10px;
            background: var(--paper);
            border: 2px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 4px solid #95a5a6;
        }

        .marker-item:hover {
            border-left-color: var(--green);
            background: var(--green-light);
        }

        .marker-item.active {
            border-left-color: var(--red);
            background: #FDF0EE;
            border-color: #E8B4AC;
        }

        .marker-number {
            display: inline-block;
            min-width: 24px;
            height: 24px;
            padding: 0 4px;
            background: var(--green);
            color: white;
            border-radius: 12px;
            text-align: center;
            line-height: 24px;
            font-weight: bold;
            margin-right: 8px;
            font-size: 0.82em;
        }

        .marker-name {
            font-weight: 600;
            color: var(--ink);
            font-size: 0.95em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .photo-badge {
            background: var(--red);
            color: white;
            font-size: 0.7em;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: bold;
        }

        .ficha-badge {
            color: var(--green-dark);
            font-size: 0.75em;
        }

        #map { flex: 1; background: #e0e0e0; position: relative; }

        .info-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            bottom: 20px;
            width: 440px;
            background: var(--surface);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.18);
            padding: 0;
            overflow: hidden;
            display: none;
            z-index: 1000;
            border-left: 4px solid var(--green);
            flex-direction: column;
        }

        .info-panel.active { display: flex; }

        .info-panel-header {
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .info-panel-body {
            overflow-y: auto;
            padding: 16px 20px 24px;
            flex: 1;
        }

        .info-title {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--green-dark);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-coords {
            font-size: 0.82em;
            color: var(--ink-soft);
            background: var(--paper);
            padding: 6px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--ink-soft);
            padding: 0;
            line-height: 1;
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-top: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 7px 8px;
            background: var(--paper);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.82em;
            font-weight: 600;
            color: var(--ink-soft);
            font-family: inherit;
        }

        .tab-btn.active {
            background: var(--green);
            color: white;
            border-color: var(--green);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .gallery-thumb {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            cursor: pointer;
            background: #ecf0f1;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease;
            border: 2px solid transparent;
        }

        .gallery-thumb:hover { transform: scale(1.06); border-color: var(--green); }
        .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; }

        .gallery-empty, .ficha-empty {
            color: #9aa79f;
            font-size: 0.9em;
            text-align: center;
            padding: 30px 16px;
            background: var(--paper);
            border-radius: 6px;
        }

        .ficha-section {
            margin-bottom: 16px;
        }

        .ficha-section-title {
            font-size: 0.8em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--green-dark);
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border);
        }

        .ficha-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 5px 0;
            font-size: 0.88em;
            border-bottom: 1px dashed var(--border);
        }

        .ficha-row:last-child { border-bottom: none; }
        .ficha-label { color: var(--ink-soft); flex-shrink: 0; }
        .ficha-value { text-align: right; font-weight: 600; color: var(--ink); }

        .score-pill {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85em;
            color: white;
        }
        .score-0 { background: #95a5a6; }
        .score-1 { background: #E8A33D; }
        .score-2 { background: var(--green); }

        .classificacao-pill {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85em;
            color: white;
        }
        .cl-SATISFATORIO { background: var(--green); }
        .cl-REGULAR { background: #E8A33D; }
        .cl-INSATISFATORIO { background: #D9773F; }
        .cl-CRITICO { background: var(--red); }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.88);
        }
        .modal.active { display: flex; align-items: center; justify-content: center; }
        .modal-content { max-width: 90%; max-height: 90%; position: relative; }
        .modal-content img { max-width: 100%; max-height: 85vh; border-radius: 8px; }
        .modal-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.2); border: none; color: white;
            font-size: 24px; padding: 10px 15px; cursor: pointer; border-radius: 4px; z-index: 10;
        }
        .modal-nav.prev { left: 10px; }
        .modal-nav.next { right: 10px; }
        .close-modal {
            position: absolute; top: 15px; right: 15px; font-size: 30px; color: white;
            cursor: pointer; background: rgba(0,0,0,0.3); border: none; border-radius: 50%;
            width: 42px; height: 42px;
        }

        .stats {
            background: var(--green-light);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.88em;
            color: var(--green-dark);
            border-left: 3px solid var(--green);
        }

        .legend {
            background: rgba(255,255,255,0.98);
            padding: 14px;
            border-radius: 6px;
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 999;
            font-size: 0.88em;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            border-left: 4px solid var(--green);
        }
        .legend-title { font-weight: bold; margin-bottom: 8px; color: var(--green-dark); }
        .legend-item { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
        .legend-marker {
            width: 18px; height: 18px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }

        @media (max-width: 768px) {
            .sidebar { width: 100%; max-height: 180px; }
            .info-panel { width: calc(100% - 24px); left: 12px; right: 12px; top: auto; bottom: 12px; max-height: 60vh; }
            .container { flex-direction: column; }
            #map { min-height: 300px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>🗺️ Escoramentos de Fachada</h1>
            <p class="subtitle">Centro Histórico de Salvador · PPGAU-UFBA</p>
            <input type="text" class="search-box" id="searchBox" placeholder="Buscar escoramento...">
            <div class="stats">
                <div>📍 <strong id="totalMarkers">29</strong> locais mapeados</div>
                <div>📸 <strong id="totalPhotos">0</strong> fotos</div>
                <div>📋 <strong id="totalFichas">0</strong> fichas preenchidas</div>
            </div>
            <div class="marker-list" id="markerList"></div>
        </div>

        <div id="map"></div>

        <div class="legend">
            <div class="legend-title">📍 Legenda</div>
            <div class="legend-item"><div class="legend-marker" style="background: #1E6B3E;"></div><span>Escoramento documentado</span></div>
            <div class="legend-item"><div class="legend-marker" style="background: #C0392B;"></div><span>Com fotos</span></div>
            <div class="legend-item"><div style="width: 18px; height: 3px; background: #1E6B3E;"></div><span>Centro Histórico</span></div>
        </div>

        <div class="info-panel" id="infoPanel">
            <div class="info-panel-header">
                <div class="info-title">
                    <span id="infoTitle">Escoramento</span>
                    <button class="close-btn" onclick="closeInfo()">✕</button>
                </div>
                <div class="info-coords" id="infoCoords">Coordenadas</div>
                <div class="tabs">
                    <button class="tab-btn active" data-tab="fotos" onclick="switchTab('fotos')">📸 Fotos</button>
                    <button class="tab-btn" data-tab="ficha" onclick="switchTab('ficha')">📋 Ficha</button>
                </div>
            </div>
            <div class="info-panel-body">
                <div class="tab-content active" id="tab-fotos">
                    <div class="gallery-grid" id="galleryGrid"></div>
                </div>
                <div class="tab-content" id="tab-ficha">
                    <div id="fichaContent"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="photoModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closePhotoModal()">✕</button>
            <button class="modal-nav prev" onclick="previousPhoto()">❮</button>
            <img id="modalPhoto" src="" alt="Foto">
            <button class="modal-nav next" onclick="nextPhoto()">❯</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        // Dados reais dos 29 escoramentos (levantamento de campo)
        const markersData = [
            {"name": "01", "lat": -12.9776817, "lng": -38.513388, "description": "R. Visc. de Ouro Preto, 69"},
            {"name": "02", "lat": -12.9761578, "lng": -38.5122193, "description": "R. Ruy Barbosa, 47"},
            {"name": "03", "lat": -12.9754483, "lng": -38.5114871, "description": "Ladeira da Praça, 26 - Centro"},
            {"name": "04", "lat": -12.9753426, "lng": -38.5110416, "description": ""},
            {"name": "05", "lat": -12.9749032, "lng": -38.5101455, "description": ""},
            {"name": "06", "lat": -12.9749167, "lng": -38.5111144, "description": "Rua do Tijolo"},
            {"name": "07", "lat": -12.9747978, "lng": -38.5110715, "description": ""},
            {"name": "08", "lat": -12.9747848, "lng": -38.5112485, "description": ""},
            {"name": "09", "lat": -12.9746477, "lng": -38.5107423, "description": ""},
            {"name": "10", "lat": -12.9738745, "lng": -38.5100493, "description": ""},
            {"name": "11", "lat": -12.9737262, "lng": -38.5104033, "description": ""},
            {"name": "12", "lat": -12.972832, "lng": -38.511909, "description": "Ladeira da Montanha, 13"},
            {"name": "13", "lat": -12.9712837, "lng": -38.5098921, "description": "R. do Tabuão, 48"},
            {"name": "14", "lat": -12.9692403, "lng": -38.5078485, "description": "R. do Passo, 70 - Sto. Antônio Além do Carmo"},
            {"name": "15", "lat": -12.9781889, "lng": -38.516401, "description": "R. Visc. de Mauá, 116"},
            {"name": "16", "lat": -12.9758573, "lng": -38.5144549, "description": "Ladeira da Conceição da Praia, 5 - Centro"},
            {"name": "17", "lat": -12.9733588, "lng": -38.5127058, "description": "R. do Corpo Santo, 7 - Comércio"},
            {"name": "18", "lat": -12.9728101, "lng": -38.5122459, "description": "R. do Corpo Santo, 29"},
            {"name": "19", "lat": -12.9705822, "lng": -38.5098393, "description": "Rua do Julião, 7"},
            {"name": "20", "lat": -12.9704711, "lng": -38.5098018, "description": "Rua do Julião"},
            {"name": "21", "lat": -12.9666506, "lng": -38.5047908, "description": ""},
            {"name": "22", "lat": -12.9660635, "lng": -38.5045626, "description": "R. dos Adôbes, 29"},
            {"name": "23", "lat": -12.9654019, "lng": -38.503628, "description": "Largo Quitandinha do Capim, 10 - Santo Antônio"},
            {"name": "24", "lat": -12.9609364, "lng": -38.5011432, "description": ""},
            {"name": "25", "lat": -12.9597001, "lng": -38.500603, "description": "Ladeira da Soledade, 8"},
            {"name": "26a", "lat": -12.9583297, "lng": -38.4998171, "description": "Ladeira da Soledade, 150"},
            {"name": "26b", "lat": -12.9704384, "lng": -38.5065052, "description": "R. do Álvo, 28"},
            {"name": "27", "lat": -12.9708673, "lng": -38.5063326, "description": "R. do Álvo, 31"},
            {"name": "28", "lat": -12.9762484, "lng": -38.510248, "description": ""},
            {"name": "29", "lat": -12.9766072, "lng": -38.5103487, "description": "Rua do Gravatá, 7"}
        ];

        // Poligonal real do Centro Histórico (levantamento de campo)
        const polygonCoords = [
            [-12.9775722, -38.5147706], [-12.9772063, -38.5149262], [-12.9768613, -38.5150227],
            [-12.9766156, -38.5150013], [-12.9761085, -38.5144863], [-12.9755544, -38.5140464],
            [-12.975178, -38.5138479], [-12.974488, -38.5133705]
        ];

        let map, markersLayer = [], currentSelected = null, currentPhotos = [], currentPhotoIndex = 0;
        let photosMapping = {};
        let fichasData = {};

        const D1_LABELS = { desaprumo: 'Desaprumo da Fachada', flambagem: 'Flambagem/Desalinhamento', travamentos: 'Travamentos Laterais', degradacaoMadeira: 'Degradação em Madeira', corrosaoAco: 'Corrosão em Aço', calcos: 'Distribuição de Carga (Calços)' };
        const D2_LABELS = { estadoAlvenaria: 'Estado da Alvenaria', reversibilidade: 'Reversibilidade das Fixações' };
        const D3_LABELS = { espacoCalcada: 'Espaço Livre em Calçada', alturaLivre: 'Altura Livre p/ Pedestres', riscoColisao: 'Risco de Colisão', sinalizacao: 'Sinalização e Segurança', impactoVisual: 'Impacto Visual' };

        async function loadData() {
            try {
                const r = await fetch('./fotos-mapeamento.json');
                if (r.ok) { const d = await r.json(); photosMapping = d.mapping || {}; }
            } catch (e) { console.warn('fotos-mapeamento.json não encontrado ainda'); }

            try {
                const r = await fetch('./fichas-escoramentos.json');
                if (r.ok) { const d = await r.json(); fichasData = d.escoramentos || {}; }
            } catch (e) { console.warn('fichas-escoramentos.json não encontrado ainda'); }
        }

        function initMap() {
            map = L.map('map').setView([-12.973, -38.512], 16);

            const tileLayer = L.tileLayer('https://stamen-tiles-{s}.a.ssl.fastly.net/tonerline/{z}/{x}/{y}.png', {
                attribution: '© Stamen', maxZoom: 20, crossOrigin: 'anonymous'
            });
            const cartoDBLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {
                attribution: '© CartoDB', maxZoom: 19, crossOrigin: 'anonymous'
            });
            tileLayer.addTo(map);
            tileLayer.on('tileerror', () => { map.removeLayer(tileLayer); cartoDBLayer.addTo(map); });

            if (polygonCoords.length > 0) {
                L.polyline(polygonCoords, { color: '#1E6B3E', weight: 3, opacity: 0.9, dashArray: '5, 5' })
                    .addTo(map).bindPopup('<strong>Centro Histórico</strong>');
            }

            addMarkers();
            populateList();
            updateStats();
        }

        function updateStats() {
            let totalPhotos = 0, totalFichas = 0;
            markersData.forEach(d => {
                totalPhotos += (photosMapping[d.name] || []).length;
                if (fichasData[d.name]) totalFichas++;
            });
            document.getElementById('totalPhotos').textContent = totalPhotos;
            document.getElementById('totalFichas').textContent = totalFichas + ' / 29';
        }

        function addMarkers() {
            markersLayer.forEach(m => map.removeLayer(m));
            markersLayer = [];

            markersData.forEach((data) => {
                const photoCount = (photosMapping[data.name] || []).length;
                const marker = L.circleMarker([data.lat, data.lng], {
                    radius: 12, fillColor: photoCount > 0 ? '#C0392B' : '#1E6B3E',
                    color: '#fff', weight: 2, fillOpacity: 0.85
                }).addTo(map);

                const label = L.tooltip({ permanent: true, direction: 'center' });
                label.setContent(`<div style="font-weight:bold; color:white; font-size:11px;">${data.name}</div>`);
                marker.bindTooltip(label);
                marker.bindPopup(`<strong>Escoramento ${data.name}</strong>${photoCount > 0 ? `<div style="color:#C0392B;font-weight:600;">📸 ${photoCount} fotos</div>` : ''}`);
                marker.on('click', () => selectMarker(data));
                markersLayer.push(marker);
            });
        }

        function populateList() {
            const list = document.getElementById('markerList');
            list.innerHTML = '';
            markersData.forEach(data => {
                const photoCount = (photosMapping[data.name] || []).length;
                const hasFicha = !!fichasData[data.name];
                const item = document.createElement('div');
                item.className = 'marker-item';
                item.innerHTML = `
                    <div class="marker-name">
                        <div><span class="marker-number">${data.name}</span>Esc. ${data.name}</div>
                        ${photoCount > 0 ? `<span class="photo-badge">${photoCount}</span>` : ''}
                    </div>
                    <div style="font-size: 0.85em; color: #5B6B62; margin-top: 4px;">
                        📍 ${data.description || (data.lat.toFixed(4) + ', ' + data.lng.toFixed(4))}
                        ${hasFicha ? '<span class="ficha-badge">· 📋 ficha ok</span>' : ''}
                    </div>
                `;
                item.onclick = () => selectMarker(data);
                item.dataset.name = data.name;
                list.appendChild(item);
            });
        }

        function selectMarker(data) {
            currentSelected = data;
            currentPhotoIndex = 0;

            document.querySelectorAll('.marker-item').forEach(item => item.classList.remove('active'));
            document.querySelector(`[data-name="${data.name}"]`)?.classList.add('active');

            document.getElementById('infoTitle').textContent = `Escoramento ${data.name}`;
            document.getElementById('infoCoords').textContent = `📍 ${data.description ? data.description + ' · ' : ''}${data.lat.toFixed(5)}, ${data.lng.toFixed(5)}`;

            currentPhotos = photosMapping[data.name] || [];
            renderGallery();
            renderFicha(data.name);

            document.getElementById('infoPanel').classList.add('active');
            switchTab('fotos');
            map.flyTo([data.lat, data.lng], 18);
        }

        function renderGallery() {
            const gallery = document.getElementById('galleryGrid');
            if (currentPhotos.length > 0) {
                gallery.innerHTML = currentPhotos.map((photo, idx) => `
                    <div class="gallery-thumb" onclick="openPhotoModal(${idx})">
                        <img src="fotos/${photo}" alt="${photo}" loading="lazy" onerror="this.parentElement.style.background='#ecf0f1'">
                    </div>
                `).join('');
            } else {
                gallery.innerHTML = '<div class="gallery-empty">📷 Fotos ainda não adicionadas para este escoramento</div>';
            }
        }

        function scoreP(v) {
            if (v === null || v === undefined) return '<span class="score-pill" style="background:#c8cfc9;">–</span>';
            return `<span class="score-pill score-${v}">${v}</span>`;
        }

        function renderFicha(name) {
            const f = fichasData[name];
            const el = document.getElementById('fichaContent');
            if (!f) {
                el.innerHTML = '<div class="ficha-empty">📋 Ficha ainda não preenchida para este escoramento.<br><br>Preencha em <code>admin.html</code> ou no Word e atualize <code>fichas-escoramentos.json</code>.</div>';
                return;
            }

            let html = '';

            html += `<div class="ficha-section"><div class="ficha-section-title">Identificação</div>`;
            html += rowIf('Endereço', f.endereco);
            html += rowIf('Bairro', f.bairro);
            html += rowIf('Data da avaliação', f.dataAvaliacao);
            html += rowIf('Tipologia', f.tipologia);
            html += rowIf('Material', f.material);
            html += rowIf('Estado geral', f.estadoGeral);
            html += `</div>`;

            if (f.d1) {
                html += `<div class="ficha-section"><div class="ficha-section-title">D1 · Dimensão Estrutural</div>`;
                Object.keys(D1_LABELS).forEach(k => {
                    html += `<div class="ficha-row"><span class="ficha-label">${D1_LABELS[k]}</span><span class="ficha-value">${scoreP(f.d1[k])}</span></div>`;
                });
                html += `</div>`;
            }

            if (f.d2) {
                html += `<div class="ficha-section"><div class="ficha-section-title">D2 · Dimensão Patrimonial</div>`;
                Object.keys(D2_LABELS).forEach(k => {
                    html += `<div class="ficha-row"><span class="ficha-label">${D2_LABELS[k]}</span><span class="ficha-value">${scoreP(f.d2[k])}</span></div>`;
                });
                html += `</div>`;
            }

            if (f.d3) {
                html += `<div class="ficha-section"><div class="ficha-section-title">D3 · Dimensão Urbana</div>`;
                Object.keys(D3_LABELS).forEach(k => {
                    html += `<div class="ficha-row"><span class="ficha-label">${D3_LABELS[k]}</span><span class="ficha-value">${scoreP(f.d3[k])}</span></div>`;
                });
                html += `</div>`;
            }

            // Pontuação total
            if (f.d1 || f.d2 || f.d3) {
                const sum = obj => Object.values(obj || {}).reduce((a, b) => a + (typeof b === 'number' ? b : 0), 0);
                const total = sum(f.d1) + sum(f.d2) + sum(f.d3);
                const pct = Math.round((total / 26) * 100);
                let cls = 'CRITICO';
                if (pct >= 75) cls = 'SATISFATORIO';
                else if (pct >= 50) cls = 'REGULAR';
                else if (pct >= 25) cls = 'INSATISFATORIO';
                html += `<div class="ficha-section"><div class="ficha-section-title">Pontuação</div>
                    <div class="ficha-row"><span class="ficha-label">Total</span><span class="ficha-value">${total} / 26 (${pct}%)</span></div>
                    <div class="ficha-row"><span class="ficha-label">Classificação</span><span class="classificacao-pill cl-${cls}">${cls}</span></div>
                    </div>`;
            }

            const obs = [
                ['Danos à alvenaria (tipologia)', f.eixo1TipologiaDanos],
                ['Distância do oceano', f.eixo2DistanciaOceano],
                ['Corrosão observada', f.eixo2Corrosao],
                ['Obs. maresia/corrosão', f.eixo2Obs],
                ['Agentes biológicos urbanos', f.eixo3Biologico],
                ['Obs. degradação biológica', f.eixo3Obs],
                ['Descrição geral', f.descricaoGeral],
                ['Intervenções realizadas', f.intervencoesRealizadas],
                ['Acessibilidade em campo', f.acessibilidadeCampo],
                ['Recomendações imediatas', f.recomendacoesImediatas],
            ].filter(([, v]) => v);

            if (obs.length) {
                html += `<div class="ficha-section"><div class="ficha-section-title">Observações</div>`;
                obs.forEach(([label, val]) => {
                    html += `<div style="margin-bottom:8px;"><div class="ficha-label" style="font-size:0.82em; margin-bottom:2px;">${label}</div><div style="font-size:0.9em;">${val}</div></div>`;
                });
                html += `</div>`;
            }

            if (f.pesquisador) {
                html += `<div class="ficha-section"><div class="ficha-section-title">Pesquisador</div>${rowIf('Nome', f.pesquisador)}${rowIf('Data', f.dataFicha)}</div>`;
            }

            el.innerHTML = html || '<div class="ficha-empty">Ficha vazia.</div>';
        }

        function rowIf(label, val) {
            if (!val) return '';
            return `<div class="ficha-row"><span class="ficha-label">${label}</span><span class="ficha-value">${val}</span></div>`;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
        }

        function openPhotoModal(index) {
            currentPhotoIndex = index;
            document.getElementById('modalPhoto').src = `fotos/${currentPhotos[index]}`;
            document.getElementById('photoModal').classList.add('active');
        }
        function nextPhoto() {
            if (currentPhotoIndex < currentPhotos.length - 1) {
                currentPhotoIndex++;
                document.getElementById('modalPhoto').src = `fotos/${currentPhotos[currentPhotoIndex]}`;
            }
        }
        function previousPhoto() {
            if (currentPhotoIndex > 0) {
                currentPhotoIndex--;
                document.getElementById('modalPhoto').src = `fotos/${currentPhotos[currentPhotoIndex]}`;
            }
        }
        function closePhotoModal() { document.getElementById('photoModal').classList.remove('active'); }
        function closeInfo() { document.getElementById('infoPanel').classList.remove('active'); }

        document.getElementById('searchBox').addEventListener('input', (e) => {
            const search = e.target.value.toLowerCase();
            document.querySelectorAll('.marker-item').forEach(item => {
                item.style.display = item.dataset.name.includes(search) ? 'block' : 'none';
            });
        });

        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('photoModal').classList.contains('active')) return;
            if (e.key === 'ArrowRight') nextPhoto();
            if (e.key === 'ArrowLeft') previousPhoto();
            if (e.key === 'Escape') closePhotoModal();
        });

        document.addEventListener('DOMContentLoaded', async () => {
            await loadData();
            initMap();
        });

        document.getElementById('photoModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closePhotoModal();
        });
    </script>
</body>
</html>
